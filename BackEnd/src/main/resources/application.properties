spring.application.name=backend

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/exportpro_db
spring.datasource.username=root
spring.datasource.password=root123

# Hibernate/JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port
server.port=8080

# JWT secret (from environment variable, not hardcoded)
jwt.secret=${JWT_SECRET}

# CORS allowed origins (comma-separated). No fallback on purpose —
# if CORS_ALLOWED_ORIGINS isn't set, the app fails to start instead of
# silently serving a stale/wrong origin.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB